name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Aplica todas as migrations num Postgres vazio e roda os testes de segurança (RLS e
  # funções SECURITY DEFINER) em supabase/ci/smoke.sql.
  migrations:
    name: Migrations e segurança
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Cliente psql
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Aplicar migrations e rodar testes
        run: supabase/ci/run.sh

  # Testes unitários (node:test, sem dependências): rodam direto com o Node, sem npm install.
  testes:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Typecheck e build do app. As dependências vêm do npm público e são instaladas pelo
  # package-lock.json (mesmas versões diretas do bun.lock, que aponta para um cache privado do
  # Lovable inacessível fora dele). Se o package.json mudar sem o lock, a CI avisa e instala sem
  # trava de versões; para regenerar: `npm install --package-lock-only --ignore-scripts`.

  app:
    name: Typecheck e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: >-
          npm ci --ignore-scripts --no-audit --no-fund ||
          (echo "::warning::package-lock.json fora de sincronia com o package.json; instalando sem o lock. Regenere com 'npm install --package-lock-only --ignore-scripts'." &&
          npm install --ignore-scripts --no-audit --no-fund)
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build

  # Bloqueante: erros do ESLint (inclui formatação do Prettier) reprovam a CI. Avisos não reprovam.
  # Para corrigir formatação: `npx eslint . --fix`.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: >-
          npm ci --ignore-scripts --no-audit --no-fund ||
          (echo "::warning::package-lock.json fora de sincronia com o package.json; instalando sem o lock. Regenere com 'npm install --package-lock-only --ignore-scripts'." &&
          npm install --ignore-scripts --no-audit --no-fund)
      - name: ESLint
        run: npx eslint .
